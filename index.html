<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>昆明冬鸟手帐</title>
<meta name="description" content="昆明 11–4 月观鸟：半月日程、36 种鸟的图鉴、入门手册和天气。记录只存在本机。">
<meta name="theme-color" content="#f2ede5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1b17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="冬鸟手帐">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./fonts/lxgwwenkaigbscreen/result.min.css">
<link rel="stylesheet" href="./fonts/lxgwwenkaimonogbscreen/result.min.css">
<style>
/* 布局：手机单栏，一屏一个任务；底部固定四个标签（日程 / 图鉴 / 手册 / 我的）。
   配色沿用「慢慢联系」：燕麦（默认）/ 暮紫，各有浅深两套；不用纯白纯黑；无动画；实线细边框。 */
:root {
  --bg: #f2ede5;
  --surface: #faf7f2;
  --surface-2: #ece5da;
  --text: #3a332b;
  --muted: #675e52;
  --border: #e0d6c7;
  --accent: #7e6447;
  --accent-text: #faf7f2;
  --accent-soft: #ebe1d3;
  --accent-strong: #5e4a34;
  --warn: #9a7a35;
  --illo-ink: #8c7b66;
  --illo-fill: #e8dcc9;
  --font-body: 'LXGW WenKai GB Screen', 'LXGW WenKai Screen', 'LXGW WenKai', 'LXGW WenKai TC', 'Kaiti SC', 'STKaiti', -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
  --font-data: 'LXGW WenKai Mono GB Screen', 'LXGW WenKai Mono TC', ui-monospace, 'SF Mono', Menlo, monospace;
  --fs-s: 0.8125rem;
  --fs-m: 0.9375rem;
  --fs-b: 1rem;
  --fs-l: 1.1875rem;
  --fs-xl: 1.5rem;
  --r: 8px;
  --bar-h: 58px;
  color-scheme: light;
}
:root[data-palette="dusk"] {
  --bg: #eeecf1; --surface: #f8f7fa; --surface-2: #e6e3ec; --text: #322f3a; --muted: #625e75;
  --border: #dcd8e3; --accent: #645e80; --accent-text: #f8f7fa; --accent-soft: #e3e0ec; --accent-strong: #4a4563;
  --warn: #8f7738; --illo-ink: #7d7896; --illo-fill: #dfdbea;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e1b17; --surface: #27231e; --surface-2: #312c26; --text: #ded6ca; --muted: #b3a898;
    --border: #3d372f; --accent: #a99174; --accent-text: #1f1913; --accent-soft: #3a3128; --accent-strong: #e3cfb2;
    --warn: #c4a765; --illo-ink: #a8977f; --illo-fill: #3a3128;
    color-scheme: dark;
  }
  :root:not([data-theme="light"])[data-palette="dusk"] {
    --bg: #1b1a20; --surface: #24232b; --surface-2: #2e2c36; --text: #dad7e1; --muted: #ada8bc;
    --border: #3a3845; --accent: #9890b8; --accent-text: #1c1a24; --accent-soft: #34314a; --accent-strong: #d3cdea;
    --warn: #c2a768; --illo-ink: #8f89aa; --illo-fill: #34314a;
  }
}
:root[data-theme="dark"] {
  --bg: #1e1b17; --surface: #27231e; --surface-2: #312c26; --text: #ded6ca; --muted: #b3a898;
  --border: #3d372f; --accent: #a99174; --accent-text: #1f1913; --accent-soft: #3a3128; --accent-strong: #e3cfb2;
  --warn: #c4a765; --illo-ink: #a8977f; --illo-fill: #3a3128;
  color-scheme: dark;
}
:root[data-theme="dark"][data-palette="dusk"] {
  --bg: #1b1a20; --surface: #24232b; --surface-2: #2e2c36; --text: #dad7e1; --muted: #ada8bc;
  --border: #3a3845; --accent: #9890b8; --accent-text: #1c1a24; --accent-soft: #34314a; --accent-strong: #d3cdea;
  --warn: #c2a768; --illo-ink: #8f89aa; --illo-fill: #34314a;
}
:root[data-font="large"] { font-size: 18.5px; }

*, *::before, *::after { box-sizing: border-box; animation: none !important; scroll-behavior: auto !important; }
html { -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: var(--fs-b); line-height: 1.7; letter-spacing: 0.01em;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent-strong); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.35; margin: 0; font-weight: 700; }
p { margin: 0; }
ul, ol { margin: 0; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }

.shell {
  max-width: 680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(var(--bar-h) + env(safe-area-inset-bottom, 0px) + 32px);
}
.view { display: flex; flex-direction: column; gap: 20px; }
.view[hidden] { display: none; }
.pagehead { display: flex; flex-direction: column; gap: 4px; }
.pagehead h1 { font-size: var(--fs-xl); }
.pagehead .sub { color: var(--muted); font-size: var(--fs-s); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { font-size: var(--fs-l); }
.card h3 { font-size: var(--fs-b); }
.label { font-size: var(--fs-s); color: var(--muted); letter-spacing: 0.06em; }
.note { font-size: var(--fs-s); color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
.btn { font-size: var(--fs-m); padding: 6px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); cursor: pointer; transition: background-color 120ms, color 120ms; }
.btn.quiet { background: var(--surface); color: var(--accent-strong); border-color: var(--border); }
.btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.chip { display: inline-block; font-size: var(--fs-s); border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 1px 10px; color: var(--text); text-decoration: none; }
a.chip:hover { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { font-size: var(--fs-s); background: transparent; border: 0; padding: 5px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }

/* 日程 */
.period-nav { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.period-nav select { width: 100%; font: inherit; font-size: var(--fs-b); color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); }
.facts > div { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.facts > div + div { border-left: 1px solid var(--border); }
.facts .v { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: var(--fs-l); }
.facts .k { font-size: var(--fs-s); color: var(--muted); }
.plan-title { display: flex; flex-direction: column; gap: 6px; }
.plan-title h2 { font-size: var(--fs-xl); }
.tag-now { display: inline-block; font-size: var(--fs-s); padding: 0 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent-strong); border: 1px solid var(--accent); margin-left: 8px; vertical-align: 3px; font-weight: 400; }
ol.route { padding-left: 1.5em; display: flex; flex-direction: column; gap: 8px; }
ol.route li::marker { font-family: var(--font-data); color: var(--muted); }
ol.route b { font-weight: 700; }
ul.plain { padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.timebox { display: flex; flex-direction: column; gap: 6px; }
.timeline { position: relative; height: 34px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); overflow: hidden; }
.timeline .day { position: absolute; top: 0; bottom: 0; background: var(--surface-2); }
.timeline .best { position: absolute; top: 6px; bottom: 6px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 4px; }
.timeline .tick { position: absolute; bottom: 1px; font-family: var(--font-data); font-size: 11px; color: var(--muted); transform: translateX(-50%); }
.weather { display: flex; flex-direction: column; gap: 8px; }
.wx-tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: var(--fs-s); }
th, td { padding: 6px 6px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
th { color: var(--muted); font-weight: 400; }
td.n { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.ok { color: var(--accent-strong); }
.so { color: var(--warn); }
.crowd { display: inline-flex; gap: 3px; vertical-align: -1px; }
.crowd i { width: 8px; height: 8px; border-radius: 2px; border: 1px solid var(--muted); display: inline-block; }
.crowd i.on { background: var(--muted); }

/* 图鉴 */
.filters { display: flex; flex-direction: column; gap: 10px; }
.filters input[type="search"] { width: 100%; font: inherit; font-size: var(--fs-b); color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 7px 12px; }
.filters .row { gap: 8px 12px; align-items: center; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: var(--fs-s); color: var(--muted); }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.splist { list-style: none; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.splist li + li { border-top: 1px solid var(--border); }
.splist a { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; text-decoration: none; color: var(--text); }
.splist a:hover { background: var(--surface-2); }
.sp-name { font-size: var(--fs-b); font-weight: 700; }
.sp-meta { font-size: var(--fs-s); color: var(--muted); }
.seen-mark { font-size: var(--fs-s); color: var(--accent-strong); border: 1px solid var(--accent); border-radius: 4px; padding: 0 6px; white-space: nowrap; }
.sil { width: 56px; height: 40px; display: block; }
.sil * { fill: none; stroke: var(--illo-ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sil .f { fill: var(--illo-fill); }
.sil .g { stroke: var(--border); stroke-width: 1.2; }
.sil .k { fill: var(--illo-ink); stroke: none; }
.big-sil .sil { width: 112px; height: 80px; }
.months { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; width: 108px; }
.months span { height: 14px; border-radius: 2px; border: 1px solid var(--border); background: var(--bg); font-family: var(--font-data); font-size: 9px; line-height: 12px; text-align: center; color: var(--muted); }
.months span.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }
.months span.cur { outline: 1.5px solid var(--text); outline-offset: 0; }
.months.wide { width: 100%; max-width: 360px; }
.months.wide span { height: 26px; font-size: 12px; line-height: 24px; }
.sp-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.sp-head h1 { font-size: var(--fs-xl); }
.sp-head .sci { font-style: italic; color: var(--muted); font-size: var(--fs-s); }
dl.kv { display: grid; grid-template-columns: 5em minmax(0, 1fr); gap: 6px 12px; margin: 0; font-size: var(--fs-m); }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; }
.marks { padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.sizebar { position: relative; height: 40px; margin-top: 4px; }
.sizebar .axis { position: absolute; left: 0; right: 0; top: 18px; border-top: 1px solid var(--border); }
.sizebar .ref { position: absolute; top: 12px; width: 1px; height: 12px; background: var(--muted); }
.sizebar .ref span { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }
.sizebar .me { position: absolute; top: 9px; width: 12px; height: 18px; margin-left: -6px; border-radius: 3px; background: var(--accent); }
.back { align-self: flex-start; }

/* 手册 */
.toc { list-style: none; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.toc li + li { border-top: 1px solid var(--border); }
.toc a { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; text-decoration: none; color: var(--text); }
.toc a:hover { background: var(--surface-2); }
.toc .d { color: var(--muted); font-size: var(--fs-s); }
.prose { display: flex; flex-direction: column; gap: 12px; max-width: 38em; }
.prose h3 { font-size: var(--fs-b); margin-top: 6px; }
.order { padding-left: 1.5em; display: flex; flex-direction: column; gap: 6px; }
.order li::marker { font-family: var(--font-data); color: var(--muted); }
.places { display: flex; flex-direction: column; gap: 12px; }

/* 我的 */
.stat { display: flex; gap: 24px; flex-wrap: wrap; }
.stat div { display: flex; flex-direction: column; }
.stat .v { font-family: var(--font-data); font-size: var(--fs-xl); font-variant-numeric: tabular-nums; }
.stat .k { font-size: var(--fs-s); color: var(--muted); }
.status { font-size: var(--fs-s); color: var(--muted); border-top: 1px solid var(--border); padding-top: 10px; }
.pref { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* 底部标签 */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabbar nav { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--bar-h); }
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--muted); font-size: 12px; border-radius: 6px; margin: 4px; }
.tabbar a svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.tabbar a[aria-current="page"] { color: var(--accent-strong); background: var(--accent-soft); }

@media (max-width: 460px) {
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .facts > div:nth-child(3) { border-left: 0; }
  .facts > div:nth-child(n+3) { border-top: 1px solid var(--border); }
  .splist a { grid-template-columns: 48px minmax(0, 1fr); }
  .splist .months { grid-column: 2; }
  .sil { width: 48px; height: 34px; }
}
/* 照片 */
.thumb { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; display: block; background: var(--surface-2); border: 1px solid var(--border); }
.photo { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.photo img { width: 100%; height: auto; border-radius: 6px; background: var(--surface-2); display: block; }
.photo figcaption { font-size: var(--fs-s); color: var(--muted); }
.photo figcaption a { color: var(--muted); }
.credits { font-size: var(--fs-s); color: var(--muted); padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
details > summary { cursor: pointer; color: var(--accent-strong); font-size: var(--fs-m); }
details[open] > summary { margin-bottom: 10px; }
.file-in { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
@media (max-width: 460px) { .thumb { width: 48px; height: 48px; } }
</style>
</head>
<body>

<div class="shell">
  <section class="view" id="v-plan" aria-labelledby="h-plan"></section>
  <section class="view" id="v-guide" aria-labelledby="h-guide" hidden></section>
  <section class="view" id="v-manual" aria-labelledby="h-manual" hidden></section>
  <section class="view" id="v-me" aria-labelledby="h-me" hidden></section>
</div>

<div class="tabbar">
  <nav aria-label="主要栏目">
    <a href="#plan" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>日程</span></a>
    <a href="#guide" data-tab="guide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5c3-1.2 5.5-1 8 .8 2.5-1.8 5-2 8-.8v13c-3-1.2-5.5-1-8 .8-2.5-1.8-5-2-8-.8z"/><path d="M12 6.3v13"/></svg><span>图鉴</span></a>
    <a href="#manual" data-tab="manual"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h9l3 3v14H6z"/><path d="M9 10h6M9 13.5h6M9 17h4"/></svg><span>手册</span></a>
    <a href="#me" data-tab="me"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l3 3 5-6"/></svg><span>我的</span></a>
  </nav>
</div>

<script>
'use strict';
/* =========================================================
   数据：地点
   crowd：工作日 / 周末 人流，1 少 · 2 中 · 3 多
   ========================================================= */
const PLACES = {
  haigeng: { n: '海埂大坝', area: '西山区 · 滇池北岸', crowd: [2, 3],
    go: '导航到“海埂大坝”。打车最省事；观鸥季有季节性公交专线，线路以当年公布为准。',
    open: '开放式堤岸，全天可进。',
    note: '红嘴鸥在滇池的主要聚集点。堤岸长约 2 公里，从西段往东走，人会越来越少。' },
  daguan: { n: '大观公园', area: '西山区 · 近一环', crowd: [2, 3],
    go: '导航到“大观公园”，在一环附近，市区出发打车约 15–30 分钟。',
    open: '收门票，开放时间以公园公告为准。',
    note: '大观楼前水面与庾园一带有红嘴鸥；园内水道可看小䴙䴘、黑水鸡。2026 年 10 月 31 日首批红嘴鸥进园。' },
  cuihu: { n: '翠湖公园', area: '五华区 · 市中心', crowd: [2, 3],
    go: '导航到“翠湖公园”，市中心，地铁或步行可达。',
    open: '开放式公园。',
    note: '城区看鸥最方便的地点；湖面上有时有普通秋沙鸭、红头潜鸭、白眼潜鸭。周末和中午人多。' },
  baofeng: { n: '宝丰湿地公园', area: '官渡区 · 新宝象河入湖口', crowd: [1, 2],
    go: '地铁 5 号线宝丰站，或导航到“宝丰湿地公园”。',
    open: '开放时间以公园公告为准。',
    note: '有观鸟廊，周围生境岛吸引水鸟；记录过 100 多种鸟，包括灰鹤、彩鹮、池鹭、白鹭、苍鹭、黑水鸡、红隼。' },
  laoyuhe: { n: '捞鱼河湿地公园', area: '呈贡区 · 环湖东路', crowd: [1, 2],
    go: '导航到“捞鱼河湿地公园”。',

/* 日出日落（NOAA 近似算法），昆明 25.04°N 102.71°E，北京时间 */
function sunTimes(y, m, d) {
  const lat = 25.04, lon = 102.71, tz = 8, rad = Math.PI / 180;
  const N = Math.round((Date.UTC(y, m - 1, d) - Date.UTC(y, 0, 1)) / 864e5) + 1;
  const g = 2 * Math.PI / 365 * (N - 1);
  const eqt = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const ha = Math.acos(Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(decl)) - Math.tan(lat * rad) * Math.tan(decl)) / rad;
  return { rise: 720 - 4 * (lon + ha) - eqt + tz * 60, set: 720 - 4 * (lon - ha) - eqt + tz * 60 };
}
function periodRange(p) {
  const y = yearOf(p.m), last = daysIn(y, p.m);
  return p.h === 1 ? [1, 15] : [16, last];
}
function periodLabel(p) { return p.m + '月' + (p.h === 1 ? '上半月' : '下半月'); }
function currentPeriodId(date) {
  const m = date.getMonth() + 1, d = date.getDate();
  if (!SEASON.includes(m)) return null;
  return m + (d <= 15 ? 'a' : 'b');
}

}

function sizeText(L) {
  const lower = REFS.filter(r => r[1] <= L).pop(), upper = REFS.find(r => r[1] > L);
  if (!lower) return `比麻雀（14 cm）还小`;
  if (!upper) return `比苍鹭（94 cm）还大`;
  if (Math.abs(L - lower[1]) <= 2) return `和${lower[0]}差不多大`;
  if (Math.abs(upper[1] - L) <= 2) return `和${upper[0]}差不多大`;
  return `介于${lower[0]}（${lower[1]} cm）和${upper[0]}（${upper[1]} cm）之间`;
}

}

/* 天气：直接向 Open-Meteo 请求昆明 8 天预报，结果缓存在本机；离线时用缓存 */
const WX_KEY = 'km-birds-weather';
const WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=25.04&longitude=102.71&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=Asia%2FShanghai&forecast_days=8';
try { weather = JSON.parse(localStorage.getItem(WX_KEY) || 'null'); } catch (e) {}
let wxFetching = false;
async function loadWeather(force) {
  const age = weather && weather.updatedAt ? Date.now() - new Date(weather.updatedAt).getTime() : Infinity;
  if (wxFetching || (!force && age < 2 * 36e5)) return;
  wxFetching = true; weatherState = 'loading'; if (route.tab === 'plan') render();
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 12000);
    const r = await fetch(WX_URL, { signal: ctl.signal }); clearTimeout(t);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = (await r.json()).daily;
    weather = { source: 'Open-Meteo', updatedAt: new Date().toISOString(), days: d.time.map((date, i) => ({
      date, code: d.weather_code[i], tmax: d.temperature_2m_max[i], tmin: d.temperature_2m_min[i],
      pop: d.precipitation_probability_max[i], wind: d.wind_speed_10m_max[i] })) };
    try { localStorage.setItem(WX_KEY, JSON.stringify(weather)); } catch (e) {}
    weatherState = 'ready';
  } catch (e) { weatherState = 'error'; }
  wxFetching = false;
  if (route.tab === 'plan') render();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadWeather(false); });

}

      const dt = new Date(d.date + 'T00:00:00'); const wk = '日一二三四五六'[dt.getDay()];
      const good = (d.pop ?? 0) < 40 && (d.wind ?? 0) < 20;
      return `<tr><td class="n">${dt.getMonth() + 1}/${dt.getDate()} 周${wk}</td><td>${wxText(d.code)}</td><td class="n">${Math.round(d.tmin)}–${Math.round(d.tmax)}</td><td class="n">${d.pop ?? '—'}%</td><td class="n">${Math.round(d.wind ?? 0)}</td><td class="${good ? 'ok' : 'so'}">${good ? '适合' : '可能受影响'}</td></tr>`;
    }).join('')}</tbody></table></div>
    <p class="note">预报来源：${esc(weather.source || 'Open-Meteo')}，更新于 ${upd.getMonth() + 1}月${upd.getDate()}日 ${pad(upd.getHours())}:${pad(upd.getMinutes())}${ageH > 30 ? '（已超过一天，可能不准）' : ''}${weatherState === 'error' ? '；刚才重新获取没有成功，显示的是上次的结果' : ''}。“适合”的标准：降水概率低于 40%，最大风速低于 20 km/h。</p>`;
  } else {
    const m = today.getMonth() + 1, c = CLIMATE[m];
    body = `<p class="note">${weatherState === 'loading' ? '正在读取预报。' : weatherState === 'error' ? '没有取到预报：网络不通或预报服务没有响应。下次打开页面时会再试。' : '这里还没有近期预报。'}${c ? `本月长期平均：最高约 ${c[0]}°C，最低约 ${c[1]}°C，月降水约 ${c[2]} mm。` : ''}出门前可在中国天气网查看昆明预报：<a href="http://www.weather.com.cn/weather/101290101.shtml" target="_blank" rel="noopener">weather.com.cn/weather/101290101.shtml</a></p>`;
  }
  return `<div class="card weather"><div class="row" style="justify-content:space-between"><h2>今天的出行条件</h2><span class="note num">${today.getMonth() + 1}月${today.getDate()}日</span></div>
    <div class="facts"><div><span class="k">日出</span><span class="v">${hm(st.rise)}</span></div><div><span class="k">日落</span><span class="v">${hm(st.set)}</span></div><div><span class="k">鸟最活跃</span><span class="v">${hm(st.rise + 30)}–${hm(st.rise + 180)}</span></div><div><span class="k">傍晚时段</span><span class="v">${hm(st.set - 120)}–${hm(st.set)}</span></div></div>
    ${body}</div>`;
}
function timeline(p, st) {
  const lo = 6, hi = 20, x = h => ((h - lo) / (hi - lo) * 100).toFixed(2) + '%';
  const rise = st.rise / 60, set = st.set / 60;
  return `<div class="timebox"><span class="label">一天中的时段（${lo}:00–${hi}:00）</span>
    <div class="timeline" role="img" aria-label="日出 ${hm(st.rise)}，日落 ${hm(st.set)}，建议 ${hm(p.best[0] * 60)} 到 ${hm(p.best[1] * 60)}">
      <div class="day" style="left:${x(rise)};width:calc(${x(set)} - ${x(rise)})"></div>
      <div class="best" style="left:${x(p.best[0])};width:calc(${x(p.best[1])} - ${x(p.best[0])})"></div>
      ${[6, 9, 12, 15, 18].map(h => `<span class="tick" style="left:${x(h)}">${h}</span>`).join('')}
    </div>
    <span class="note">浅色底：日出到日落；框：建议时段 ${hm(p.best[0] * 60)}–${hm(p.best[1] * 60)}</span></div>`;
}

/* ---------- 我的 ---------- */
function statusText() {
  const where = '记录只保存在这台设备上，不会上传。换手机或删除主屏幕图标前，请先导出备份。';
  const when = lastSaved ? ` · 最近保存 ${pad(lastSaved.getHours())}:${pad(lastSaved.getMinutes())}` : '';
  const err = saveErr ? ` 保存失败（${saveErr}）。可能是浏览器开了无痕模式，换成普通模式打开即可保存。` : '';
  return where + when + err;
}
function renderStatus() { const el = $('#store-status'); if (el) el.textContent = statusText(); }
function renderMe() {
  const seenIds = Object.keys(log.seen).filter(id => SPById[id]).sort((a, b) => log.seen[a] < log.seen[b] ? 1 : -1);
  $('#v-me').innerHTML = `<header class="pagehead"><h1 id="h-me">我的记录</h1><p class="sub">只记录给自己看</p></header>
    <div class="card"><div class="stat"><div><span class="v">${seenIds.length}<span class="note"> / ${SP.length}</span></span><span class="k">已见鸟种</span></div><div><span class="v">${PLANS.filter(p => log.done[p.id]).length}<span class="note"> / ${PLANS.length}</span></span><span class="k">已去过的日程</span></div></div>
      <p class="status" id="store-status">${statusText()}</p></div>
    <section class="card"><h2>已见鸟种</h2>${seenIds.length ? `<ul class="splist">${seenIds.map(id => { const s = SPById[id]; return `<li><a href="#guide/${id}">${thumbHtml(s)}<div><div class="sp-name">${s.n}</div><div class="sp-meta num">${log.seen[id]}</div></div><span></span></a></li>`; }).join('')}</ul>` : '<p class="note">还没有记录。在图鉴里打开一种鸟，点“记为已见（今天）”。</p>'}</section>
    <section class="card"><h2>显示设置</h2>
      <div class="pref"><span>配色</span><div class="seg" role="group" aria-label="配色"><button type="button" data-pal="oat">燕麦</button><button type="button" data-pal="dusk">暮紫</button></div></div>
      <div class="pref"><span>字号</span><div class="seg" role="group" aria-label="字号"><button type="button" data-font="normal">标准</button><button type="button" data-font="large">大</button></div></div>
      <p class="note">深色和浅色跟随手机的外观设置。显示设置保存在这台设备上。</p></section>
    <section class="card"><h2>备份记录</h2>
      <p class="note">导出会生成一个 .json 文件，保存到“文件”App。导入时，文件里的记录会合并进来，现有记录不会被删除。</p>
      <div class="row"><button class="btn quiet" type="button" id="exp-btn">导出记录</button><label class="btn quiet" for="imp-file">导入记录</label><input class="file-in" type="file" id="imp-file" accept="application/json,.json"></div>
      <p class="note" id="io-msg" aria-live="polite"></p></section>
    <section class="card"><details><summary>照片与字体来源</summary>
      <p class="note">鸟种照片来自 Wikimedia Commons，按各自的知识共享（CC）许可使用，本手帐只缩小了尺寸。点名字可打开原图页面，查看完整的作者与许可信息。</p>
      <ul class="credits">${SP.filter(s => PHOTOS[s.id]).map(s => `<li><a href="${PHOTOS[s.id].u}" target="_blank" rel="noopener">${s.n}</a>：${esc(PHOTOS[s.id].a)} · ${esc(PHOTOS[s.id].l)}</li>`).join('')}</ul>
      <p class="note">字体：霞鹜文楷 GB 屏幕阅读版，SIL Open Font License 1.1（<a href="licenses/LXGW-WenKai-Screen-OFL.txt">许可全文</a>）。天气：Open-Meteo（CC BY 4.0）。</p></details></section>`;
  $('#exp-btn').onclick = exportLog;
  $('#imp-file').onchange = e => { const f = e.target.files && e.target.files[0]; if (f) importLog(f); e.target.value = ''; };
  document.querySelectorAll('#v-me [data-pal]').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.pal === prefs.pal)); b.onclick = () => { prefs.pal = b.dataset.pal; applyPrefs(); renderMe(); }; });
  document.querySelectorAll('#v-me [data-font]').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.font === prefs.font)); b.onclick = () => { prefs.font = b.dataset.font; applyPrefs(); renderMe(); }; });
}

/* ---------- 总渲染 ---------- */
function render() {
  ['plan', 'guide', 'manual', 'me'].forEach(t => { $('#v-' + t).hidden = t !== route.tab; });
  document.querySelectorAll('.tabbar a').forEach(a => { if (a.dataset.tab === route.tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (route.tab === 'plan') renderPlan();
  if (route.tab === 'guide') renderGuide();
  if (route.tab === 'manual') renderManual();
  if (route.tab === 'me') renderMe();
}
window.addEventListener('hashchange', () => {
  const prev = route.tab + '/' + route.arg;
  parseHash();
  render();
  if (prev !== route.tab + '/' + route.arg) window.scrollTo(0, 0);
});
parseHash();
render();
loadWeather(false);
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
</script>
</body>
</html>
